<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldIQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js" defer></script>
<script src="./brand-config.js"></script>
<script src="./fiq-tz.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fiq-canvas);color:var(--fiq-ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 20px 50px}
body.signin-active{height:100vh;overflow:hidden}
body.signin-active #identitySection{flex:1;min-height:0;display:flex;flex-direction:column}
body.signin-active .user-list{flex:1;max-height:none}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-cloud{font-size:26px;line-height:1}
.brand-text h1{font-size:26px;font-weight:600;letter-spacing:-0.5px;color:var(--fiq-ink)}
.brand-text h1 span{color:var(--fiq-primary)}
.brand-text p{font-size:10px;color:var(--fiq-secondary);letter-spacing:1.2px;text-transform:uppercase;font-weight:600;margin-top:2px}
.logo{text-align:left;margin-bottom:28px}
.modules{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.module{
  display:flex;align-items:center;gap:16px;background:var(--fiq-surface);border:1px solid var(--fiq-border);border-radius:18px;
  padding:18px 20px;text-decoration:none;color:var(--fiq-ink);box-shadow:0 4px 14px rgba(81,75,99,0.05);transition:transform 0.15s;position:relative;
}
.module:active{transform:scale(0.98)}
.module-icon-wrap{
  width:50px;height:50px;border-radius:14px;background:var(--fiq-tint);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
}
.module-icon-wrap [data-lucide]{width:26px;height:26px;stroke-width:1.8;color:var(--fiq-primary)}
.module-text{flex:1}
.module-title{font-size:15.5px;font-weight:600;color:var(--fiq-ink);margin-bottom:2px}
.module-desc{font-size:12px;color:var(--fiq-secondary);font-weight:500}
.module-arrow{color:var(--fiq-secondary);font-size:18px;font-weight:600}
.module-badge{
  position:absolute;right:40px;top:16px;min-width:22px;height:22px;border-radius:999px;background:#e0344a;color:var(--fiq-surface);
  display:none;align-items:center;justify-content:center;font-size:11px;font-weight:600;padding:0 7px;
  box-shadow:0 4px 10px rgba(224,52,74,0.25);
}
.module-badge.visible{display:inline-flex}
.module.primary{border-color:transparent;background:linear-gradient(135deg,var(--fiq-highlight),var(--fiq-strong));box-shadow:0 10px 26px rgba(117,98,133,0.32)}
.module.primary .module-title{color:var(--fiq-surface)}
.module.primary .module-desc{color:#dbecff}
.module.primary .module-icon-wrap{background:var(--fiq-surface)}
.module.primary .module-icon-wrap [data-lucide]{color:var(--fiq-primary)}
.module.primary .module-arrow{color:var(--fiq-surface)}
.section-label{font-size:11px;color:var(--fiq-secondary);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin:22px 0 10px;width:100%;max-width:380px}
.footer{margin-top:32px;text-align:center;color:var(--fiq-secondary);font-size:11px;font-weight:600}
.signin-welcome{width:100%;max-width:380px;margin-bottom:16px}
.signin-welcome h2{font-size:19px;font-weight:600;color:var(--fiq-ink);letter-spacing:-0.3px;margin-bottom:4px}
.signin-welcome p{font-size:13px;color:var(--fiq-secondary);font-weight:600;line-height:1.5}
.user-search-box{width:100%;max-width:380px;margin-bottom:12px}
.user-search-box input{
  width:100%;padding:13px 16px;background:var(--fiq-surface);border:1.5px solid var(--fiq-border);border-radius:14px;
  font-size:14px;font-weight:600;color:var(--fiq-ink);outline:none;box-shadow:0 4px 14px rgba(81,75,99,0.05);
}
.user-search-box input:focus{border-color:var(--fiq-primary)}
.user-list{width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:360px;overflow-y:auto;padding-right:2px}
.user-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--fiq-surface);border:1.5px solid var(--fiq-border);
  border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;box-shadow:0 2px 8px rgba(81,75,99,0.04);
  font-family:inherit;
}
.user-row:active{transform:scale(0.98)}
.user-row.last-used{border-color:var(--fiq-primary);background:var(--fiq-hover)}
.user-row-name{font-size:14.5px;font-weight:600;color:var(--fiq-ink)}
.user-row-meta{font-size:11.5px;color:var(--fiq-secondary);font-weight:600;margin-top:2px}
.user-row-tag{font-size:9.5px;font-weight:600;color:var(--fiq-primary);background:var(--fiq-tint);border-radius:999px;padding:3px 9px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;white-space:nowrap}
.user-list-empty{font-size:12.5px;color:var(--fiq-secondary);font-weight:600;text-align:center;padding:20px 4px}
.user-list-retry-btn{margin-top:10px;border:none;background:var(--fiq-primary);color:var(--fiq-surface);padding:10px 18px;border-radius:10px;font-weight:600;font-size:12.5px;cursor:pointer;display:block;margin-left:auto;margin-right:auto}
.pin-box{
  width:100%;max-width:380px;margin-bottom:16px;background:var(--fiq-surface);border:1px solid var(--fiq-border);
  border-radius:16px;padding:18px;box-shadow:0 4px 14px rgba(81,75,99,0.05);
}
.pin-box label{font-size:11px;color:var(--fiq-secondary);margin-bottom:10px;display:block;text-transform:uppercase;letter-spacing:0.6px;font-weight:600}
.pin-box-userline{font-size:13px;font-weight:600;color:var(--fiq-ink);margin-bottom:12px}
.pin-box-userline span{color:var(--fiq-secondary);font-weight:600}
.pin-box input{
  width:100%;padding:16px;background:var(--fiq-canvas);border:1.5px solid var(--fiq-border);border-radius:12px;color:var(--fiq-ink);
  font-size:20px;letter-spacing:6px;text-align:center;outline:none;font-weight:600;
}
.pin-box input:focus{border-color:var(--fiq-primary)}
.pin-box .pin-btn{
  width:100%;padding:14px;margin-top:12px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--fiq-highlight),var(--fiq-strong));color:var(--fiq-surface);font-size:14.5px;font-weight:600;cursor:pointer;
  box-shadow:0 6px 16px rgba(117,98,133,0.3);
}
.pin-error{color:#e0344a;font-size:12px;margin-top:10px;text-align:center;display:none;font-weight:600}
.pin-error.visible{display:block}
.pin-cancel{font-size:12px;color:var(--fiq-secondary);text-align:center;margin-top:12px;display:block;cursor:pointer;text-decoration:underline;font-weight:600}
.user-locked{
  width:100%;max-width:380px;display:flex;align-items:center;justify-content:space-between;
  background:var(--fiq-surface);border:1px solid var(--fiq-border);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:10px;gap:10px;
  box-shadow:0 4px 14px rgba(81,75,99,0.05);
}
.user-locked-info{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.user-locked-avatar{font-size:20px}
.user-locked-info>div{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.user-locked-name{font-size:14px;font-weight:600;color:var(--fiq-ink)}
.user-locked-role{font-size:11.5px;color:var(--fiq-secondary);font-weight:600}
.user-greeting{font-size:12px;color:var(--fiq-secondary);margin-top:3px;font-weight:600}
.switch-user-btn{flex:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--fiq-strong);background:var(--fiq-surface);border:1px solid var(--fiq-border);border-radius:9px;cursor:pointer;padding:7px 12px;min-height:36px}
.switch-user-btn:hover{background:var(--fiq-tint);border-color:var(--fiq-primary)}
.switch-user-btn:focus-visible{outline:2px solid var(--fiq-primary);outline-offset:2px}
.notif-panel{background:#ffe1e5;border:1px solid #f5c2c8;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.notif-panel-header{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.notif-bell{font-size:14px;line-height:1}
.notif-title{font-size:12px;font-weight:650;color:#c43048;text-transform:uppercase;letter-spacing:.5px}
.notif-body{font-size:12.5px;color:var(--fiq-ink);line-height:1.5;font-weight:500;margin-bottom:12px}
.notif-action-btn{display:inline-flex;align-items:center;gap:6px;background:#c43048;color:var(--fiq-surface);border:none;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none}
.notif-action-btn:hover{background:#a82840}
.rep-briefing-card{background:var(--fiq-surface);border:1px solid var(--fiq-border);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(81,75,99,0.05)}
.buddy-day-card{background:linear-gradient(145deg,var(--fiq-surface) 0%,var(--fiq-hover) 100%);border-color:var(--fiq-border);box-shadow:0 12px 30px rgba(117,98,133,.13);padding:20px}
.buddy-day-kicker{font-size:10px;font-weight:650;letter-spacing:1.4px;color:var(--fiq-primary);text-transform:uppercase;margin-bottom:5px}
.buddy-day-title{font-size:23px;line-height:1.18;font-weight:650;letter-spacing:-.5px;color:var(--fiq-ink);margin-bottom:6px}
.buddy-day-sub{font-size:13px;line-height:1.5;color:var(--fiq-secondary);font-weight:600;margin-bottom:16px;max-width:520px}
.buddy-plan-label{font-size:10px;font-weight:650;letter-spacing:1px;color:var(--fiq-secondary);text-transform:uppercase;margin:13px 0 7px}
.buddy-plan-label:first-child{margin-top:0}
.buddy-first-move{background:var(--fiq-tint);border-color:var(--fiq-border)}
.buddy-first-move .rep-item-rank{width:24px;height:24px;background:var(--fiq-ink)}
.buddy-success-box{margin-top:12px;padding:11px 12px;border-radius:11px;background:#eaf8f1;border:1px solid #c7ead8;color:#175c3a;font-size:12.5px;line-height:1.45;font-weight:600}
.buddy-success-box strong{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;color:#208153}
.rep-briefing-header{display:flex;align-items:flex-start;gap:16px}
.rep-briefing-icon{font-size:20px;line-height:1;flex-shrink:0}
.rep-briefing-icon img{width:48px;height:57px;object-fit:contain;display:block}
.rep-briefing-content{flex:1;min-width:0}
.rep-briefing-title{font-size:14px;font-weight:600;color:var(--fiq-ink);margin-bottom:6px}
@media (max-width:480px){
  .rep-briefing-header{flex-direction:column;align-items:center;text-align:left}
  .rep-briefing-icon img{width:76px;height:76px}
  .rep-briefing-content{width:100%}
}
#repBriefingSection{max-width:380px}
@media(min-width:481px){#repBriefingSection{max-width:720px}}
.rep-briefing-sub{font-size:11px;color:var(--fiq-secondary);font-weight:600;margin-top:1px}
.rep-briefing-loading{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fiq-secondary);font-weight:600}
.rep-briefing-spinner{width:14px;height:14px;border:2px solid var(--fiq-tint);border-top:2px solid var(--fiq-primary);border-radius:50%;animation:repBriefSpin .7s linear infinite}
@keyframes repBriefSpin{to{transform:rotate(360deg)}}
.rep-briefing-error{font-size:12.5px;color:#7a6000;background:#fff3e0;border:1px solid #ffe0a3;border-radius:10px;padding:10px 12px}
.rep-briefing-retry{margin-top:8px;border:none;background:var(--fiq-primary);color:var(--fiq-surface);padding:7px 13px;border-radius:8px;font-weight:600;font-size:11.5px;cursor:pointer}
.rep-item{display:flex;align-items:center;gap:10px;background:var(--fiq-wash);border:1px solid var(--fiq-tint);border-radius:10px;padding:10px 12px;margin-bottom:6px;text-decoration:none}
.rep-item:last-child{margin-bottom:0}
.rep-item-link{cursor:pointer}
.rep-item-link:hover{border-color:var(--fiq-border);background:var(--fiq-tint)}
.rep-item-rank{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--fiq-primary);color:var(--fiq-surface);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.rep-plan-narrative{font-size:13px;color:var(--fiq-ink);line-height:1.6;font-weight:500;margin-bottom:12px}
.rep-plan-remaining{font-size:11.5px;color:var(--fiq-secondary);font-weight:600;margin-top:8px;text-align:center}
.rep-plan-remaining a{color:var(--fiq-primary);font-weight:600;text-decoration:none}
.rep-item-text{font-size:13px;color:var(--fiq-ink);font-weight:600;flex:1;line-height:1.4}
.rep-item-nav{font-size:10.5px;color:var(--fiq-primary);font-weight:600;flex-shrink:0;white-space:nowrap}
.rep-coach-btn{display:block;width:100%;text-align:center;background:var(--fiq-wash);border:1.5px solid var(--fiq-border);color:var(--fiq-primary);font-size:13px;font-weight:600;padding:11px;border-radius:12px;cursor:pointer;margin-top:12px}
.rep-coach-btn:hover:not(:disabled){background:var(--fiq-tint)}
.rep-coach-btn:disabled{opacity:.5;cursor:not-allowed}
.rep-coach-deep{font-size:12.5px;color:var(--fiq-ink);line-height:1.6;font-weight:500;margin-top:12px;padding-top:12px;border-top:1px solid var(--fiq-tint)}
.buddy-card .rep-briefing-title{margin-bottom:4px}
.buddy-card{background:linear-gradient(135deg,#fffefa 0%,#fcf9fd 100%);border:1px solid #e9e2ec;border-radius:24px;box-shadow:0 8px 24px rgba(120,100,134,.06);padding:20px;color:var(--fiq-strong)}
.buddy-card:before{content:none}
.buddy-card .buddy-choice{background:#fffdfd;border:1px solid #e3dae8;border-radius:14px;color:var(--fiq-strong);padding:14px 12px;font-size:15px;font-weight:500;gap:10px}
.buddy-card .buddy-choice:hover{background:#f6f1f8;border-color:#c8b8d2}
.buddy-card .buddy-choice:focus-visible,.buddy-card .buddy-plan-summary:focus-visible{outline:2px solid var(--fiq-primary);outline-offset:3px}
.buddy-control-icon{width:19px;height:19px;flex:0 0 19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.buddy-card .buddy-conversation{border-top-color:#e9e2ec}
.buddy-card .buddy-chat-title{color:var(--fiq-strong);font-weight:500}
.buddy-chat-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.buddy-chat-back{border:0;background:none;color:var(--fiq-primary);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px 0}
.buddy-chat-back:focus-visible{outline:2px solid var(--fiq-primary);outline-offset:3px}
.buddy-chat-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.buddy-voice-btn{border:1.5px solid var(--fiq-primary);background:var(--fiq-surface);color:var(--fiq-strong);font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:7px 14px;min-height:36px;cursor:pointer}
.buddy-voice-btn.buddy-voice-active{background:var(--fiq-surface);border-color:#c8b8d2;color:var(--fiq-strong);font-weight:500}
.buddy-voice-btn.buddy-voice-resume{background:var(--fiq-primary);border-color:var(--fiq-primary);color:#fff}
/* Interruption trial: a control bar under the status - a square-cornered Stop button with a stop
   symbol (not a pill that looks like a chat bubble) and End beside it, so a long chat never needs
   scrolling back to the top to end. */
.buddy-voice-controls{display:flex;gap:8px;align-items:stretch;margin:6px 0 10px}
.buddy-voice-controls[hidden]{display:none}
.buddy-voice-stop,.buddy-voice-end{font:inherit;font-size:14px;font-weight:700;border-radius:10px;min-height:44px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.buddy-voice-stop{flex:1 1 auto;background:var(--fiq-primary);border:1.5px solid var(--fiq-primary);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.buddy-voice-stop-icon{display:inline-block;width:12px;height:12px;border-radius:2px;background:currentColor;flex:0 0 auto}
.buddy-voice-end{flex:0 0 auto;background:var(--fiq-surface);border:1.5px solid #c8b8d2;color:var(--fiq-strong)}
.buddy-voice-stop[hidden],.buddy-voice-end[hidden]{display:none}
.buddy-voice-stop:focus-visible,.buddy-voice-end:focus-visible{outline:2px solid var(--fiq-primary);outline-offset:3px}
.buddy-voice-btn:focus-visible{outline:2px solid var(--fiq-primary);outline-offset:3px}
.buddy-voice-btn[hidden]{display:none}
.buddy-voice-btn:disabled,.buddy-choice:disabled{opacity:.5;cursor:not-allowed}
.buddy-card .buddy-choice.buddy-choice-primary{flex-basis:100%;width:100%;justify-content:center;background:var(--fiq-primary);border-color:var(--fiq-primary);color:#fff;font-weight:600;min-height:48px}
.buddy-card .buddy-choice.buddy-choice-primary:hover{background:var(--fiq-strong);border-color:var(--fiq-strong)}
.buddy-choice-hint{flex-basis:100%;width:100%;margin-top:8px;font-size:12.5px;line-height:1.4;color:var(--fiq-muted,#6b5d73)}
.buddy-card .buddy-mic:not(.buddy-recording){border:1px solid #c8b8d2}
.buddy-status.buddy-voice-status{color:#8e1b1b;font-weight:700;font-size:13px}
.buddy-status.buddy-voice-status:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#e53935;margin-right:7px;vertical-align:0;animation:buddyRecPulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.buddy-status.buddy-voice-status:before{animation:none}}
.buddy-card .buddy-chat-invite,.buddy-card .buddy-disclosure,.buddy-card .buddy-status{color:var(--fiq-secondary);font-weight:400}
.buddy-plan-slot{margin:0 0 16px}
.buddy-card .buddy-plan-details{background:#f8f5f9;border:1px solid #e9e2ec;border-radius:16px;box-shadow:none;color:var(--fiq-strong);margin:0}
.buddy-card .buddy-plan-summary{padding:18px 16px;min-height:68px}
.buddy-card .buddy-plan-summary-copy span{color:var(--fiq-secondary);font-size:12px;font-weight:400;letter-spacing:0;text-transform:none}
.buddy-card .buddy-plan-summary-copy strong{color:var(--fiq-strong);font-size:17px;font-weight:500}
.buddy-card .buddy-plan-summary-arrow{color:#a28a63}
.buddy-card .buddy-plan-body{background:#fffefa;color:var(--fiq-strong)}
.buddy-card .buddy-input{font-size:16px;font-weight:400;background:#fffdfd;color:var(--fiq-strong);border-color:#e3dae8}
.buddy-card .buddy-input:focus{border-color:var(--fiq-primary)}
.buddy-card .buddy-send,.buddy-card .buddy-mic{font-weight:500}
.buddy-card .buddy-send{background:var(--fiq-strong);color:var(--fiq-surface)}
.buddy-card .buddy-mic{background:#f1ebf4;color:var(--fiq-strong)}
.buddy-card .buddy-mic.buddy-recording{background:#c62828;color:#fff;font-weight:700}
.buddy-rec-bar{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px 10px;border-radius:10px;background:#fff6f6;border-left:3px solid #e53935;color:#8e1b1b}
.buddy-rec-bar[hidden]{display:none}
.buddy-rec-dot{width:10px;height:10px;flex:0 0 10px;border-radius:50%;background:#e53935;animation:buddyRecPulse 1.2s ease-in-out infinite}
.buddy-rec-wave{display:flex;align-items:center;gap:3px;height:16px;flex:0 0 auto}
.buddy-rec-wave span{display:block;width:3px;height:100%;border-radius:2px;background:#e53935;transform:scaleY(.3);animation:buddyRecWave 1s ease-in-out infinite}
.buddy-rec-wave span:nth-child(2){animation-delay:.15s}.buddy-rec-wave span:nth-child(3){animation-delay:.3s}.buddy-rec-wave span:nth-child(4){animation-delay:.45s}.buddy-rec-wave span:nth-child(5){animation-delay:.6s}
.buddy-rec-text{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;line-height:1.35}
.buddy-rec-label{font-weight:700;font-size:13.5px}
.buddy-rec-time{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.buddy-rec-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:#e53935;opacity:.75;transform-origin:left center}
.buddy-rec-bar.buddy-rec-ending{background:#ffeaea}
.buddy-rec-bar.buddy-rec-ending .buddy-rec-time{color:#b71c1c}
.buddy-retry{border:none;border-radius:8px;background:var(--fiq-strong);color:var(--fiq-surface);font:inherit;font-size:13px;font-weight:600;min-height:36px;padding:6px 14px;margin-top:6px;cursor:pointer}
.buddy-retry-secondary{background:var(--fiq-tint);color:var(--fiq-strong)}

var WORKER='https://fieldiq.biz';

var allUsers=[];
var lastUserId=localStorage.getItem('fieldiq_last_user_id')||'';
function isAirtableRecordId(val){
  return typeof val==='string' && /^rec[a-zA-Z0-9]{14,}$/.test(val);
}
function safeTerritoryDisplay(raw){
  var val=raw;
  if(Array.isArray(val))val=val.length?val[0]:'';

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g,function(m){
    return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]);
  });

/* Every authenticated container in this page. renderIdentity() previously
   cleared none of them, so the Ask IQ card, broadcasts, notifications,
   cancellation notices and the Rep Home cards stayed on screen beneath the
   sign-in panel after a session ended. loadRepBriefing() paints its card
   before its request returns, so on a 401 that card was always left behind.
   identitySection is deliberately NOT included: renderIdentity() and
   _fiqShowSignInRetry() both write the sign-in UI into it immediately after
   calling this. The one caller that does not - the bfcache branch - clears
   it itself. */
function _fiqClearAuthenticatedUI(){
  var ids=['cancellationNotifSection','repBriefingSection','buddyChatSection','broadcastSection','notificationsSection','modulesSection'];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el)el.innerHTML='';
  }

/* Single sign-out path for both roles. Sets the one-time reason, clears the
   session and returns to sign-in. Rep and Manager previously expressed the
   same rejection two different ways - Rep wrote a banner into a Rep Home
   container, Manager navigated away silently. */
function _fiqSignOutExpired(){
  try{sessionStorage.setItem('fieldiq_signout_reason','expired');}catch(e){}
  clearActiveSession();
  renderIdentity();
}
/* Non-auth failure after a valid /login: the token is genuine and is kept, but
   NOTHING authenticated is rendered until validation actually succeeds. Same
   shape as _showHomeStartupRetry() on Manager Home. Keeping the token is safe:
   startUp() validates before rendering on every subsequent load. */
function _fiqShowSignInRetry(onRetry){
  var section=document.getElementById('identitySection');
  if(!section)return;
  _fiqClearAuthenticatedUI();
  document.body.classList.add('signin-active');
  section.innerHTML='<div class="signin-welcome"><h2>Welcome back to FieldIQ</h2>'+
    '<p>Couldn\'t reach FieldIQ. Check your connection and try again.</p></div>'+
    '<div style="text-align:center;margin-top:14px"><button type="button" id="fiqSignInRetryBtn" class="btn-primary" style="padding:10px 22px;border:none;border-radius:8px;background:var(--fiq-primary);color:var(--fiq-surface);font-weight:700;cursor:pointer">Retry</button></div>';
  var b=document.getElementById('fiqSignInRetryBtn');
  if(b)b.addEventListener('click',function(){ onRetry(); });

function renderIdentity(){
  /* Signed-out state must show sign-in alone. Authenticated content lives in
     separate containers and was never cleared when the session ended. */
  _fiqClearAuthenticatedUI();
  document.body.classList.add('signin-active');
  /* One-time sign-out reason, consumed on read so a refresh or Back does not
     re-show a stale message. sessionStorage, not a query parameter, for the
     same reason - and it matches the set/read/clear pattern already used for
     return-state elsewhere in FieldIQ. */
  var _signoutReason='';
  try{_signoutReason=sessionStorage.getItem('fieldiq_signout_reason')||'';
      sessionStorage.removeItem('fieldiq_signout_reason');}catch(e){}
  var section=document.getElementById('identitySection');
  section.innerHTML=
    '<div class="signin-welcome">'+
      '<h2>Welcome back to FieldIQ</h2>'+
      '<p>Select your profile and enter your PIN to continue.</p>'+
    '</div>'+
    '<div class="user-search-box">'+
      '<input type="search" id="userSearchInput" placeholder="Search your name…" autocomplete="off" autocorrect="off" autocapitalize="off">'+
    '</div>'+
    '<div class="user-list" id="userListBox"><div class="user-list-empty">Loading FieldIQ profiles…</div></div>'+
    '<div id="pinSection"></div>'+
    (_signoutReason==='expired'?'<div class="pin-error visible" style="margin-top:12px">Your session has expired. Please sign in again.</div>':'');

    var q=e.target.value.trim().toLowerCase();
    if(!q){renderUserList(allUsers);return;}
    var filtered=allUsers.filter(function(u){
      return (u.name||'').toLowerCase().indexOf(q)>-1 ||
             (u.role||'').toLowerCase().indexOf(q)>-1 ||
             (u.territory||'').toLowerCase().indexOf(q)>-1;
    });
    renderUserList(filtered);
  });
  loadUsers();
}

  if (dubaiHour >= 12) return 'Good afternoon';
  return 'Good morning';
}
function renderSignedInBar(u){
  var section=document.getElementById('identitySection');

        '<div>'+
          '<div class="user-locked-name">'+escapeHtml(u.name)+'</div>'+
          '<div class="user-locked-role">'+escapeHtml(metaLine.join(' · '))+'</div>'+
        '</div>'+
      '</div>'+
      '<button type="button" class="switch-user-btn" id="notYouBtn" aria-label="Sign out of FieldIQ">Sign out</button>'+
    '</div>';

    /* Session destruction must advance the shared generation, exactly like
       clearActiveSession(), so any in-flight authenticated work - here or in another
       tab - becomes inert rather than acting on the reload that follows. */
    _fiqBumpAuthEpoch();

function renderUserList(list){
  var listBox=document.getElementById('userListBox');
  if(!list.length){
    listBox.innerHTML='<div class="user-list-empty">No matching profiles.</div>';
    return;
  }
  listBox.innerHTML=list.map(function(u){
    var meta=[u.role];
    if(u.territory)meta.push(u.territory);
    var isLast=(u.id && u.id===lastUserId);
    return '<button type="button" class="user-row'+(isLast?' last-used':'')+'" data-user-id="'+escapeHtml(u.id)+'">'+
      '<div>'+
        '<div class="user-row-name">'+escapeHtml(u.name)+'</div>'+
        '<div class="user-row-meta">'+escapeHtml(meta.join(' · '))+'</div>'+
      '</div>'+

function showPinBox(u){
  pendingUser=u;

  if(listBox)listBox.style.display='none';

      '<div class="pin-box-userline">'+escapeHtml(u.name)+' <span>· '+escapeHtml(metaLine.join(' · '))+'</span></div>'+

/* F1: the button is disabled during login, but the Enter handler calls
   checkPin() directly and never consults it, so two rapid Enters (or Enter
   plus a click) fired two /login POSTs. One in-flight flag closes every path. */
var _fiqLoginInFlight=false;
function checkPin(){
  if(_fiqLoginInFlight)return;
  var entered=document.getElementById('pinInput').value.trim();
  var errorEl=document.getElementById('pinError');
  var submitBtn=document.getElementById('pinSubmitBtn');
  if(!pendingUser){return;}
  if(!entered){
    errorEl.textContent='PIN incorrect. Please try again.';
    errorEl.className='pin-error visible';
    return;
  }
  _fiqLoginInFlight=true;
  submitBtn.disabled=true;
  submitBtn.textContent='Checking…';
  errorEl.className='pin-error';
  /* The /login request previously had no time limit of any kind, and the button is
     only restored inside .then or .catch, so a request that never settled left
     "Checking\u2026" on screen with no way out.
     Dead-connection recovery (NetLog, 21 Sep 2026): a mobile HTTP/2 connection can die
     silently, and Chrome keeps sending requests down it. It only checks the connection
     when a NEW request is sent after ~10s of silence, then declares it dead ~10s later
     and replays uncancelled requests on a fresh one. So: attempt 1 runs up to 12s; if

     and ONE identical attempt 2 is sent, which triggers that check. 12s also lets
     Chrome's own recovery of attempt 1 (~11.4s) finish first. Total budget 27s: the
     measured worst-case recovery is ~23.4s plus margin.

     settle it; a superseded attempt 1 is discarded silently, so the handlers below see
     one final outcome and never the internal cancellation. Retry happens ONLY on the
     12s timer - any response (401, 429, 5xx) or immediate network error settles at
     once, exactly as before. loginTimer is still cleared only by the handlers below,
     so it keeps covering the body read. The body is captured once, because the PIN
     box's Cancel sets pendingUser to null. */
  var loginCtrl=new AbortController();
  var loginSettled=false;
  var loginRetryTimer=null;
  var loginBody=JSON.stringify({userId:pendingUser.id,pin:entered});
  var loginResolve,loginReject;
  var loginResult=new Promise(function(resolve,reject){loginResolve=resolve;loginReject=reject;});
  function loginAttempt(){
    var myCtrl=loginCtrl;
    fetch(WORKER+'/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:loginBody,
      signal:myCtrl.signal
    }).then(function(res){
      if(loginSettled||myCtrl!==loginCtrl)return;
      loginSettled=true;clearTimeout(loginRetryTimer);loginResolve(res);
    },function(err){
      if(loginSettled||myCtrl!==loginCtrl)return;
      loginSettled=true;clearTimeout(loginRetryTimer);loginReject(err);
    });
  }
  var loginTimer=setTimeout(function(){
    if(!loginSettled){loginSettled=true;clearTimeout(loginRetryTimer);loginReject(new DOMException('The operation was aborted.','AbortError'));}
    loginCtrl.abort();
  },27000);
  loginRetryTimer=setTimeout(function(){
    if(loginSettled)return;
    var superseded=loginCtrl;loginCtrl=new AbortController();superseded.abort();loginAttempt();
  },12000);
  loginAttempt();
  loginResult
    .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, status: res.status, data: data }; }); })

function loadUsers(){
  var listBox=document.getElementById('userListBox');
  if(listBox)listBox.innerHTML='<div class="user-list-empty">Loading FieldIQ profiles…</div>';
  var ctrl=new AbortController();
  /* The single 7s abort here killed a request the Worker still considered live:
     airtableFetch allows Airtable 10s and may retry a timed-out GET once, so the
     caller was abandoning work its own backend had not given up on, and every
     Retry started that same race again. The 7s point is now a message only - the
     SAME request continues - and the abort moves to 22s, which exceeds the
     Worker's own legitimate ceiling: airtableFetch allows one 10s Airtable
     attempt and, for a GET, one further 10s retry after a timeout, plus edge
     and response-processing margin. The 429 path (10s + 1s + 10s) is covered
     by the same budget. One request, as before: no automatic retry is added. */
  var slowTimer=setTimeout(function(){
    var sb=document.getElementById('userListBox');
    if(sb)sb.innerHTML='<div class="user-list-empty">Still loading\u2026 the first load can take a moment.</div>';
  },7000);
  var timer=setTimeout(function(){ctrl.abort();},22000);
  fetch(WORKER+'/get-users',{signal:ctrl.signal})
    .then(function(res){
      /* Without this a non-2xx carrying a JSON body reached the success path,
         data.records was undefined and (data.records||[]) rendered as
         "No matching profiles" with no Retry button - a dead end. Genuine HTTP
         failures now enter the existing catch. A 2xx with zero active users is
         untouched and still shows "No matching profiles". */
      if(!res.ok)throw new Error('HTTP '+res.status);
      return res.json();
    })
    .then(function(data){
      clearTimeout(slowTimer);
      clearTimeout(timer);
      allUsers=(data.records||[]).filter(function(r){
        /* Airtable omits an unchecked checkbox, so a departed user has no
           'Active?' key and !==false was always true. Explicit true only. */
        return r.fields['Active?']===true;
      }).map(function(r){
        var f=r.fields||{};
        return {
          id: f['User ID']||'',
          name: f['Display Name']||f['User ID']||'Unknown',
          role: f['Role']||'Sales Rep',
          territory: safeTerritoryDisplay(f['Territory']),
          recordId: r.id
        };
      });
      renderUserList(allUsers);
    })
    .catch(function(err){
      clearTimeout(slowTimer);
      clearTimeout(timer);
      var box=document.getElementById('userListBox');
      if(!box)return;
      box.innerHTML='<div class="user-list-empty">Could not load profiles. Check connection and retry.'+
        '<button type="button" class="user-list-retry-btn" id="userListRetryBtn">Retry</button></div>';
      var retryBtn=document.getElementById('userListRetryBtn');
      if(retryBtn)retryBtn.addEventListener('click',loadUsers);
    });
}
/* F2: this badge and the Calendar badge each fetched the identical /get-actions

   One fetch now serves both, each keeping its own counting rule. null means
   "do not render" - never "no records supplied" - so a failure can never make
   each consumer fetch again.
   F4: 401/403 uses the existing _fiqSignOutExpired(); 5xx and network failures
   keep the previous silent degradation. */
/* One in-flight Open Actions read shared by every caller, bound to the session
   generation that launched it.
   Dedupe: renderModules() and the foreground refresh both call this; a visibility
   event mid-load would otherwise start a second read that could resolve out of
   order and repaint older data over newer.
   Key is user + record id + shared auth epoch. Identity alone is insufficient - a
   sign-out and sign-in by the same user yields identical ids - and a page-local
   epoch is insufficient because that replacement can happen in another tab. The
   epoch lives in localStorage, so any tab's genuine sign-in invalidates reads
   outstanding here, while background token renewal leaves it untouched and those
   reads still resolve normally.
   The launch token is captured separately and consulted only before signing out,
   so a 401 issued against a since-renewed token cannot end its replacement.
   On settle the slot is cleared only if it still holds this promise. A result whose
   generation no longer matches resolves to null, and every caller treats null as a
   no-op. */

  var _p=_fiqFetchOpenActionsRaw(_k,localStorage.getItem('fieldiq_session_token')||'');
  _fiqActionsRead=_p;_fiqActionsReadKey=_k;
  function _clear(){if(_fiqActionsRead===_p){_fiqActionsRead=null;_fiqActionsReadKey='';}}
  return _p.then(function(r){_clear();return r;},function(e){_clear();throw e;});
}

    Promise.all([_fiqFetchOpenActions().then(function(_a){if(_a===null||_fiqAuthEpoch()!==_renderEpoch)return;return Promise.all([updateOpenActionsBadge(_a), updateCalendarBadge(_a)]);}), _fiqFetchNotifications().then(function(_n){if(_n===null||_fiqAuthEpoch()!==_renderEpoch)return;return Promise.all([loadNotifications(_n,_renderEpoch), loadCancellationNotifications(_n,_renderEpoch)]);}), loadBroadcasts()]);

function startUp(){
  var existingToken = localStorage.getItem('fieldiq_session_token');
  if (!existingToken) {
    renderIdentity();
    return;
  }
  var startupEpoch = _fiqAuthEpoch();
  fetch(WORKER + '/validate-session', { headers: { 'Authorization': 'Bearer ' + existingToken } })
    .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, status: res.status, data: data }; }); })
    .then(function(result){
      if (_fiqAuthEpoch() !== startupEpoch) return;
      if (result.status === 401 || result.status === 403 || (result.ok && result.data && result.data.valid === false)) {
        if ((localStorage.getItem('fieldiq_session_token') || '') !== existingToken) return;
        clearActiveSession();
        renderIdentity();
        return;
      }
      if (!result.ok || !result.data || !result.data.valid) {
        if ((localStorage.getItem('fieldiq_session_token') || '') !== existingToken) return;
        renderIdentity();
        return;
      }
      var restoredUser = {
        id: result.data.userId,
        name: result.data.name,
        role: result.data.role,
        recordId: result.data.recordId
      };
      localStorage.setItem('fieldiq_user_id', restoredUser.id);
      localStorage.setItem('fieldiq_user_name', restoredUser.name);
      localStorage.setItem('fieldiq_user_territory', result.data.territory || '');
      localStorage.setItem('fieldiq_user_role', restoredUser.role);
      localStorage.setItem('fieldiq_user_record_id', restoredUser.recordId);
      localStorage.setItem('fieldiq_last_user_id', restoredUser.id);
      var renewalInitiatedForUserId = restoredUser.id;
      var renewalInitiatedForRecordId = restoredUser.recordId;
      /* Bind this renewal to the auth generation it was launched under. Identity
         checks alone let an old session's renewal overwrite a genuine replacement
         session for the SAME user - including one made in another tab - because
         user_id and user_record_id are identical again. If the generation has moved
         on, this renewal belongs to a session that no longer exists and must write
         nothing. Legitimate renewal never bumps the generation, so it still lands. */
      var renewalInitiatedForEpoch = _fiqAuthEpoch();
      fetch(WORKER + '/validate-session?renew=1', { headers: { 'Authorization': 'Bearer ' + existingToken } })
        .then(function(res){ return res.json(); })
        .then(function(renewResult){
          if (!renewResult || !renewResult.token) return;
          var currentUserId = localStorage.getItem('fieldiq_user_id');
          var currentRecordId = localStorage.getItem('fieldiq_user_record_id');
          if (currentUserId !== renewalInitiatedForUserId || currentRecordId !== renewalInitiatedForRecordId) return;
          if (renewResult.userId !== renewalInitiatedForUserId || renewResult.recordId !== renewalInitiatedForRecordId) return;
          if (_fiqAuthEpoch() !== renewalInitiatedForEpoch) return;
          if ((localStorage.getItem('fieldiq_session_token') || '') !== existingToken) return;
          localStorage.setItem('fieldiq_session_token', renewResult.token);
          localStorage.setItem('fieldiq_user_role', renewResult.role);
          localStorage.setItem('fieldiq_user_name', renewResult.name);
          localStorage.setItem('fieldiq_user_territory', renewResult.territory || '');
        })
        .catch(function(){ /* Background renewal is best-effort only \u2014 the app is already rendered and usable regardless of this call's outcome. */ });
      if (restoredUser.role === 'Manager') {
        window.location.href = './fieldiq.html';
        return;
      }
      document.body.classList.remove('signin-active');
      renderSignedInBar(restoredUser);
      renderModules();
      loadRepBriefing();
    })
    .catch(function(){
      if (_fiqAuthEpoch() !== startupEpoch) return;
      if ((localStorage.getItem('fieldiq_session_token') || '') !== existingToken) return;
      renderIdentity();
    });
}

<script>
window.addEventListener('pageshow',function(e){

     any script runs, and startUp() does not re-run. Authenticated content could
     therefore reappear for a user whose session has since been revoked. Clear
     it, return to the signed-out layout, and let the existing startUp() decide
     what may be shown - it already validates before rendering. Badges are no
     longer refreshed here: startUp() refreshes them on its own success path,
     so they are never fetched against a token that has not been revalidated.
     identitySection is blanked here too, and only here: it holds the signed-in
     name/role bar written by renderSignedInBar(), and startUp() is async, so
     without this the previous user's identity would stay on screen for the
     whole /validate-session round trip. */
  if(e.persisted){
    _fiqClearAuthenticatedUI();
    var _idSection=document.getElementById('identitySection');
    if(_idSection)_idSection.innerHTML='';
    document.body.classList.add('signin-active');

   refresh while it stayed open, so a device returning to an already-rendered Home
   kept whatever count it last painted. Refreshes ONLY the two badges from one
   shared read. Requires both badge elements - created solely by renderModules() on
   the authenticated path and destroyed by _fiqClearAuthenticatedUI() on every
   unauthenticated path including bfcache restore - AND that the identity this tab
